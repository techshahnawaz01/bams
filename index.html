/* ============================================================
   FONT CONFIGURATION
   ============================================================ */
const FONT_REGULAR_URL = "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io@main/fonts/NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Regular.ttf";
const FONT_BOLD_URL    = "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io@main/fonts/NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Bold.ttf";

let fontsReady = false;
let fontLoadPromise = null;

function loadFonts() {
  if (fontsReady) return Promise.resolve();
  if (fontLoadPromise) return fontLoadPromise;

  fontLoadPromise = Promise.all([
    fetch(FONT_REGULAR_URL).then(r => { if (!r.ok) throw new Error("Regular font fetch failed: " + r.status); return r.arrayBuffer(); }),
    fetch(FONT_BOLD_URL).then(r => { if (!r.ok) throw new Error("Bold font fetch failed: " + r.status); return r.arrayBuffer(); })
  ]).then(buffers => {
    const toBase64 = buf => {
      const bytes = new Uint8Array(buf);
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    };
    const regularName = "NotoSansDevanagari-Regular.ttf";
    const boldName = "NotoSansDevanagari-Bold.ttf";
    pdfMake.vfs = pdfMake.vfs || {};
    pdfMake.vfs[regularName] = toBase64(buffers[0]);
    pdfMake.vfs[boldName] = toBase64(buffers[1]);
    pdfMake.fonts = {
      NotoDevanagari: {
        normal: regularName,
        bold: boldName,
        italics: regularName,
        bolditalics: boldName
      },
      Latin: {
        normal: "Roboto-Regular.ttf",
        bold: "Roboto-Medium.ttf",
        italics: "Roboto-Italic.ttf",
        bolditalics: "Roboto-MediumItalic.ttf"
      }
    };
    fontsReady = true;
    return true;
  }).catch(err => {
    fontLoadPromise = null;
    throw err;
  });

  return fontLoadPromise;
}

async function waitForRenderingAssets() {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const images = Array.from(document.images || []);
  await Promise.all(images.map(image => image.complete
    ? Promise.resolve()
    : new Promise(resolve => {
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", resolve, { once: true });
      })));
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function renderShortAnswer() {
  const container = document.getElementById("shortContent");
  container.innerHTML = "";
  QUESTIONS.forEach(q => {
    const card = document.createElement("div");
    card.className = "q-card bg-white rounded-lg p-4 border border-slate-200 mb-4";
    card.dataset.qId = q.id;
    card.innerHTML = `
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center flex-shrink-0 mt-1">
          <span class="text-sm font-bold">Q${q.id}</span>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-sm font-semibold text-slate-700 mb-2">${q.title}</h3>
          <div class="answer-copy space-y-3">
          ${q.short.map(item => {
            if (item.type === "p") return `<p class="text-sm text-slate-600 leading-7">${formatInline(item.text)}</p>`;
            if (item.type === "points") return `<ul class="list-disc pl-5 text-sm text-slate-600 space-y-2">${item.items.map(x => `<li>${formatInline(x)}</li>`).join("")}</ul>`;
            if (item.type === "remember") return `<div class="bg-indigo-50 rounded-lg p-4 mt-3"><strong class="text-indigo-800">याद रखें:</strong><div class="mt-2">${item.items.map(x => `<p class="text-sm text-indigo-700 mb-2">${formatInline(x)}</p>`).join("")}</div></div>`;
            return "";
          }).join("")}</div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
  updateNavButtons();
  updateMobileNav();
  addSmoothScroll();
}

function renderLongAnswer() {

    `;

function renderLongContent(q) {
  return `
    ${q.long.map(item => {
    if (item.type === "h") return `<h4 class="text-lg font-bold text-slate-800">${formatInline(item.text)}</h4>`;
    if (item.type === "p") return `<p class="text-base text-slate-600">${formatInline(item.text)}</p>`;
    if (item.type === "points") return `<ul class="list-disc pl-5 text-slate-600 space-y-2">${item.items.map(x => `<li>${formatInline(x)}</li>`).join("")}</ul>`;
    if (item.type === "flow") return `<div class="flow-line text-slate-700 text-sm leading-8 bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">${item.lines.map(formatInline).join("<br>")}</div>`;
    if (item.type === "table") {
      const thead = `<thead class="bg-slate-50"><tr>${item.headers.map(h => `<th class="text-left p-3 text-xs font-bold text-slate-700">${formatInline(h)}</th>`).join("")}</tr></thead>`;
      const tbody = `<tbody>${item.rows.map(row => `<tr>${row.map(c => `<td class="p-3 text-sm text-slate-600 border-t border-slate-100">${formatInline(c)}</td>`).join("")}</tr>`).join("")}</tbody>`;
      return `<div class="overflow-x-auto mt-3"><table class="w-full caption-bottom text-sm border-collapse">${thead}${tbody}</table></div>`;
    }
    if (item.type === "example") return `<div class="bg-violet-50 rounded-lg p-4 mt-4"><strong>उदाहरण:</strong> ${formatInline(item.text)}</div>`;
    if (item.type === "important") return `<div class="bg-indigo-50 rounded-lg p-4 mt-4"><strong>महत्वपूर्ण बिंदु:</strong><div class="mt-2">${item.items.map(x => `<p class="text-sm text-indigo-700 mb-2">${formatInline(x)}</p>`).join("")}</div></div>`;
    return "";
  }).join("")}
  `;
}

function formatInline(value) {
  return String(value)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*\*/g, "");
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(tab) {
  if (tab === "short") {
    document.getElementById("tabShort").classList.add("bg-indigo-600", "text-white");
    document.getElementById("tabShort").classList.remove("text-slate-600", "hover:bg-slate-100");
    document.getElementById("tabLong").classList.remove("bg-indigo-600", "text-white");
    document.getElementById("tabLong").classList.add("text-slate-600", "hover:bg-slate-100");
    document.getElementById("panelShort").classList.add("active");
    document.getElementById("panelLong").classList.remove("active");
  } else {
    document.getElementById("tabLong").classList.add("bg-violet-600", "text-white");
    document.getElementById("tabLong").classList.remove("text-slate-600", "hover:bg-slate-100");
    document.getElementById("tabShort").classList.remove("bg-indigo-600", "text-white");
    document.getElementById("tabShort").classList.add("text-slate-600", "hover:bg-slate-100");
    document.getElementById("panelLong").classList.add("active");
    document.getElementById("panelShort").classList.remove("active");
  }
  updateNavButtons();
  renderQuestionNav();
}

/* ============================================================
   SEARCH
   ============================================================ */
function handleSearch(query) {
  query = query.toLowerCase().trim();
  const items = document.querySelectorAll("#shortContent > div, #longContent > div");
  let found = false;

  items.forEach((item, index) => {
    const title = item.querySelector("h3")?.textContent.toLowerCase() || "";
    const text = item.textContent.toLowerCase();
    if (title.includes(query) || text.includes(query)) {
      item.style.display = "block";
      found = true;
    } else {
      item.style.display = "none";
    }
  });

  const status = document.getElementById("status");
  if (!status) return;
  if (query === "") {
    status.textContent = "";
  } else if (found) {
    status.textContent = ` "${query}" के ${items.length} परिणाम मिले`;
    status.className = "status success";
  } else {
    status.textContent = ` "${query}" के परिणाम नहीं मिले`;
    status.className = "status error";
  }
}

    short: q.short
  })) : QUESTIONS.map(q => ({
    title: q.title,
    long: q.long
  }));

  const button = document.getElementById(type === "short" ? "btnDownloadShort" : "btnDownloadLong");
  const label = document.getElementById(type === "short" ? "btnShortLabel" : "btnLongLabel");
  const originalLabel = label.textContent;
  button.disabled = true;
  label.textContent = "Generating PDF...";
  setStatus("फ़ॉन्ट लोड हो रहा है…", "");
  try {
    await loadFonts();
    await waitForRenderingAssets();
    setStatus("PDF बन रहा है…", "");

    const docDefinition = {
      pageSize: "A4",
      pageMargins: [38, 46, 38, 42],
      defaultStyle: {
        font: "NotoDevanagari",
        fontSize: 10.2,
        lineHeight: 1.25,
        color: "#1e293b"
      },
      styles: {
        header: { fontSize: 18, bold: true, color: "#312e81" },
        subheader: { fontSize: 12, bold: true, color: "#4f46e5" },
        question: { fontSize: 12.5, bold: true, color: "#312e81", margin: [0, 8, 0, 3], keepWithNext: true },
        subquestion: { fontSize: 10.5, bold: true, color: "#4338ca", margin: [0, 5, 0, 2], keepWithNext: true },
        caption: { fontSize: 9, color: "#64748b" },
        footer: { fontSize: 10, color: "#64748b" }
      },
      header: (currentPage, pageCount) => ({
        text: pdfRichText(`BAMS - पदार्थ विज्ञान   |   ${type === "short" ? "Short Answer Notes" : "Long Answer Notes"}\nलेखक: Shahnawaz`),
        alignment: "center", font: "NotoDevanagari", fontSize: 8, bold: true, color: "#475569", margin: [0, 20, 0, 0]
      }),
      footer: (currentPage, pageCount) => ({
        text: pdfRichText(`लेखक: Shahnawaz   |   पृष्ठ ${currentPage} / ${pageCount}`),
        alignment: "center", font: "NotoDevanagari", fontSize: 8, bold: true, color: "#475569", margin: [0, 0, 0, 18]
      }),
      info: {
        title: `BAMS पदार्थ विज्ञान - ${type === "short" ? "Short Answer Notes" : "Long Answer Notes"}`,
        author: "Shahnawaz",
        subject: "BAMS Padarth Vigyan Study Notes",
        creator: "BAMS Padarth Vigyan Study Notes by Shahnawaz"
      },
      content: type === "short"
        ? generateShortPDFContent(questions)
        : generateLongPDFContent(questions)
    };

    pdfMake.createPdf(docDefinition).download(
      `${type === "short" ? "short" : "long"}-answer.pdf`
    );

    setStatus("PDF सफलतापूर्वक डाउनलोड हो गया! ✓", "success");
    showToast("PDF Downloaded", "success");
  } catch (err) {
    console.error(err);
    setStatus("फ़ॉन्ट लोड करने में त्रुटि। इंटरनेट कनेक्शन जाँचें।", "error");
    showToast("त्रुटि: " + err.message, "error");
  } finally {
    button.disabled = false;
    label.textContent = originalLabel;
    updateNavButtons();
  }
}

function pdfRichText(text) {
  // Keep only ASCII + Devanagari for maximum compatibility with embedded PDF fonts.
  const clean = String(text).replace(/[^\u0000-\u007F\u0900-\u097F]/g, " ");
  const parts = clean.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);
  return parts.flatMap(part => {
    const bold = part.startsWith("**") && part.endsWith("**");
    const value = bold ? part.slice(2, -2) : part.replace(/\*\*/g, "");
    return value.split(/([A-Za-z0-9]+)/g).filter(Boolean).map(run => ({
      text: run,
      font: /^[A-Za-z0-9]+$/.test(run) ? "Latin" : "NotoDevanagari",
      bold
    }));
  });
}

function pdfList(items, options = {}) {
  return {
    text: items.flatMap((item, index) => [
      { text: "- ", color: options.color },
      ...pdfRichText(item),
      ...(index < items.length - 1 ? [{ text: "\n" }] : [])
    ]),
    ...options
  };
}

const pdfTableLayout = {
  hLineWidth: () => 0.7,
  vLineWidth: () => 0.7,
  hLineColor: () => "#64748b",
  vLineColor: () => "#64748b",
  paddingLeft: () => 5,
  paddingRight: () => 5,
  paddingTop: () => 4,
  paddingBottom: () => 4,
  fillColor: (rowIndex) => rowIndex === 0 ? "#e2e8f0" : (rowIndex % 2 ? "#ffffff" : "#f8fafc")
};

function generateShortPDFContent(questions) {
  return [
    {
      text: pdfRichText("BAMS - पदार्थ विज्ञान"),
      style: "header",
      alignment: "center",
      margin: [0, 0, 0, 12]
    },
    {
      text: pdfRichText("Short Answer Notes\nPrepared by Shahnawaz"),
      style: "subheader",
      alignment: "center",
      margin: [0, 0, 0, 8]
    },
    {
      canvas: [
        { type: "line", x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, lineColor: "#cbd5e1" }
      ],
      margin: [0, 4, 0, 8]
    },
    {
      text: pdfRichText("Total Questions: " + questions.length),
      style: "caption",
      alignment: "center",
      margin: [0, 4, 0, 8]
    },
    { text: " ", margin: [0, 4, 0, 4] },

    ...questions.map((q, i) => [
      { text: [{ text: `प्रश्न ${i + 1}: ` }, ...pdfRichText(q.title)], style: "question", margin: [0, 4, 0, 2] },
      { text: "उत्तर:", style: "subquestion", margin: [0, 0, 0, 2] },
      ...q.short.map(item => {
        if (item.type === "p") return { text: pdfRichText(item.text), margin: [0, 1, 0, 2], fontSize: 10 };
        if (item.type === "points") return pdfList(item.items, { margin: [0, 1, 0, 4], fontSize: 10 });
        if (item.type === "remember") {
          return {
            text: [{ text: "याद रखें: ", bold: true }, ...item.items.flatMap((x, index) => [...pdfRichText(x), ...(index < item.items.length - 1 ? [{ text: " | " }] : [])])],
            margin: [0, 2, 0, 2],
            fontSize: 10,
            bold: true,
            color: "#4f46e5"
          };
        }
        return {};
      }),
      { text: " ", margin: [0, 2, 0, 2] }
    ]),
    {
      text: "- समाप्त -",
      style: "footer",
      alignment: "center",
      margin: [0, 10, 0, 0]
    }
  ];
}

function generateLongPDFContent(questions) {
  const content = [
    {
      text: pdfRichText("BAMS - पदार्थ विज्ञान"),
      style: "header",
      alignment: "center",
      margin: [0, 0, 0, 12]
    },
    {
      text: pdfRichText("Long Answer Detailed Notes\nPrepared by Shahnawaz"),
      style: "subheader",
      alignment: "center",
      margin: [0, 0, 0, 8]
    },
    {
      canvas: [
        { type: "line", x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, lineColor: "#cbd5e1" }
      ],
      margin: [0, 4, 0, 8]
    },
    {
      text: pdfRichText("Total Questions: " + questions.length),
      style: "caption",
      alignment: "center",
      margin: [0, 4, 0, 8]
    },
    { text: " ", margin: [0, 4, 0, 4] },

    ...questions.flatMap((q, i) => [
      { text: [{ text: `प्रश्न ${i + 1}: ` }, ...pdfRichText(q.title)], style: "question" },
      ...q.long.map(item => {
        if (item.type === "h") return { text: pdfRichText(item.text), style: "subquestion" };
        if (item.type === "p") return { text: pdfRichText(item.text), margin: [0, 0, 0, 3] };
        if (item.type === "points") return pdfList(item.items, { margin: [0, 0, 0, 3] });
        if (item.type === "flow") return { table: { body: item.lines.map(x => [{ text: pdfRichText(x), alignment: "center", bold: true }]) }, layout: "noBorders", margin: [0, 2, 0, 4] };
        if (item.type === "table") return {
          table: {
            headerRows: 1,
            widths: Array(item.headers.length).fill("*"),
            body: [
              item.headers.map(x => ({ text: pdfRichText(x), bold: true, color: "#1e293b", alignment: "center" })),
              ...item.rows.map(row => row.map(x => ({ text: pdfRichText(x), alignment: "left" })))
            ],
            dontBreakRows: true,
            keepWithHeaderRows: 1
          },
          layout: pdfTableLayout,
          fontSize: 8.5,
          margin: [0, 1, 0, 5]
        };
        if (item.type === "example") return { text: [{ text: "उदाहरण: ", bold: true }, ...pdfRichText(item.text)], fillColor: "#f5f3ff", margin: [4, 3, 4, 4] };
        if (item.type === "important") return pdfList(item.items, { color: "#4338ca", fillColor: "#eef2ff", margin: [4, 3, 4, 4] });
        return null;
      }).filter(Boolean),
      { text: "", margin: [0, 1, 0, 1] }
    ])
  ];
  return content;
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(title, type) {
  const toast = document.getElementById("toast");
  toast.innerHTML = `<strong>${type === "success" ? "✓" : "✗"}</strong> ${title}`;
  toast.className = "fixed bottom-6 right-6 z-50 max-w-sm bg-slate-900 text-white px-5 py-4 rounded-xl shadow-2xl text-sm font-medium " + (type === "success" ? "show success" : "show error");
  setTimeout(() => {
    toast.className = "fixed bottom-6 right-6 z-50 max-w-sm bg-slate-900 text-white px-5 py-4 rounded-xl shadow-2xl text-sm font-medium";
  }, 3000);
}

function setStatus(msg, type) {
  const el = document.getElementById("status");
  if (!el) return;
  el.textContent = msg;
  el.className = "min-h-6 mb-4 text-sm " + (type === "error" ? "text-rose-600" : type === "success" ? "text-emerald-600" : "text-slate-500");
}

/* ============================================================
   INITIALIZATION
   ============================================================ */
document.addEventListener("DOMContentLoaded", function () {
  renderShortAnswer();
  renderLongAnswer();
  renderQuestionNav();
  updateNavButtons();
  updateMobileNav();

  // Tab switching
  document.getElementById("tabShort").addEventListener("click", () => switchTab("short"));
  document.getElementById("tabLong").addEventListener("click", () => switchTab("long"));

  // Search
  document.getElementById("searchInput").addEventListener("input", (e) => handleSearch(e.target.value));

  // Download buttons
  document.getElementById("btnDownloadShort").addEventListener("click", () => downloadPDF("short"));
  document.getElementById("btnDownloadLong").addEventListener("click", () => downloadPDF("long"));
});
</script>
